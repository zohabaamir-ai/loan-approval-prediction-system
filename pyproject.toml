[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loan-approval"
version = "0.1.0"
description = "Loan approval prediction: an honest, reproducible rebuild with scikit-learn"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]
app = ["gradio==6.29.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]